services:
  postgres:
    image: postgres:15
    container_name: smart-it-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_it_helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d smart_it_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    container_name: smart-it-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://helpdesk_user:helpdesk_password@postgres:5432/smart_it_helpdesk
      SECRET_KEY: smart-it-helpdesk-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: smart-it-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data: