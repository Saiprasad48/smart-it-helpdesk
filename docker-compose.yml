services:
  postgres:
    image: postgres:15
    container_name: smart-it-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_it_helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: